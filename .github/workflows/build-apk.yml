name: Build MathMate Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare MathMate app icon
        run: |
          python3 -m venv .icon-venv
          . .icon-venv/bin/activate
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("www/assets/icons/favicon(1).png")
          target_dir = Path(".ci-assets")
          target_dir.mkdir(parents=True, exist_ok=True)
          target = target_dir / "icon.png"

          if not source.is_file():
              raise SystemExit(f"ERROR: Icon not found: {source}")

          with Image.open(source) as image:
              image = image.convert("RGBA")
              image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
              image.save(target, format="PNG")

          print(f"Prepared icon: {target}")
          PY

      - name: Generate Android app icon
        run: npx --yes @capacitor/assets@3.0.5 generate --android --assetPath .ci-assets

      - name: Set Android version code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          new_text, count = re.subn(
              r'(\bversionCode\s+)\d+',
              r'\g<1>2',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not find versionCode in android/app/build.gradle"
              )

          path.write_text(new_text)
          print("Android versionCode set to 2")
          PY

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat >> android/gradle.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          MYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS
          MYAPP_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Configure Gradle signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing = '''
              signingConfigs {
                  release {
                      storeFile file(MYAPP_RELEASE_STORE_FILE)
                      storePassword MYAPP_RELEASE_STORE_PASSWORD
                      keyAlias MYAPP_RELEASE_KEY_ALIAS
                      keyPassword MYAPP_RELEASE_KEY_PASSWORD
                  }
              }
          '''

          text = text.replace(
              "android {",
              "android {" + signing,
              1
          )

          text = text.replace(
              "buildTypes {",
              """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              """,
              1
          )

          path.write_text(text)
          PY

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MathMate-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
