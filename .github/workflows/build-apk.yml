
name: Build MathMate Release APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install dependencies
        run: npm ci

      - name: Run project tests
        run: node --test tests/*.test.cjs

      # Set version 4.0.0 and versionCode 4 automatically.
      - name: Set and verify Android version 4.0.0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          text, code_count = re.subn(
              r'(?m)^([ \t]*versionCode[ \t]+)\d+([ \t]*)$',
              lambda m: f"{m.group(1)}4{m.group(2)}",
              text,
              count=1
          )

          text, name_count = re.subn(
              r"""(?m)^([ \t]*versionName[ \t]+)["'][^"']*["']([ \t]*)$""",
              lambda m: f'{m.group(1)}"4.0.0"{m.group(2)}',
              text,
              count=1
          )

          if code_count != 1:
              raise SystemExit("ERROR: Could not update versionCode")

          if name_count != 1:
              raise SystemExit("ERROR: Could not update versionName")

          path.write_text(text, encoding="utf-8")

          print("Android version successfully configured:")
          print("versionCode = 4")
          print('versionName = "4.0.0"')
          PY

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare MathMate app icon without stretching
        run: |
          python3 -m venv .icon-venv
          . .icon-venv/bin/activate
          python -m pip install --quiet pillow

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Path("www/assets/icons/favicon(1).png")
          target_dir = Path(".ci-assets")
          target_dir.mkdir(parents=True, exist_ok=True)
          target = target_dir / "icon.png"

          if not source.is_file():
              raise SystemExit(f"ERROR: Icon not found: {source}")

          with Image.open(source) as original:
              image = original.convert("RGBA")
              fitted = ImageOps.contain(
                  image,
                  (1024, 1024),
                  method=Image.Resampling.LANCZOS,
              )

              canvas = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
              x = (1024 - fitted.width) // 2
              y = (1024 - fitted.height) // 2
              canvas.alpha_composite(fitted, (x, y))
              canvas.save(target, format="PNG")

          print(f"Prepared app icon: {target}")
          PY

      - name: Generate Android app icon
        run: npx --yes @capacitor/assets@3.0.5 generate --android --assetPath .ci-assets

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 secret is missing"
            exit 1
          }

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          test -s android/app/release.keystore || {
            echo "ERROR: Restored keystore is empty"
            exit 1
          }

      - name: Configure release signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD secret is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS secret is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD secret is missing"
            exit 1
          }

          cat >> android/gradle.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          MYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS
          MYAPP_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Configure Gradle release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          if "signingConfigs {" in text or "signingConfig signingConfigs.release" in text:
              raise SystemExit(
                  "ERROR: Release signing already exists in build.gradle"
              )

          signing = '''
              signingConfigs {
                  release {
                      storeFile file(MYAPP_RELEASE_STORE_FILE)
                      storePassword MYAPP_RELEASE_STORE_PASSWORD
                      keyAlias MYAPP_RELEASE_KEY_ALIAS
                      keyPassword MYAPP_RELEASE_KEY_PASSWORD
                  }
              }
          '''

          if "android {" not in text:
              raise SystemExit("ERROR: Could not find android {")

          text = text.replace("android {", "android {" + signing, 1)

          pattern = re.compile(
              r'(buildTypes\s*\{\s*release\s*\{)'
          )

          text, count = pattern.subn(
              r'\1\n            signingConfig signingConfigs.release',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not find the release buildType"
              )

          path.write_text(text, encoding="utf-8")
          print("Release signing configured successfully")
          PY

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify APK version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("android/app/build.gradle").read_text(encoding="utf-8")

          code = re.search(
              r'(?m)^\s*versionCode\s+(\d+)\s*$',
              text
          )

          name = re.search(
              r"""(?m)^\s*versionName\s+["']([^"']+)["']\s*$""",
              text
          )

          if not code or int(code.group(1)) != 4:
              raise SystemExit("ERROR: APK versionCode is not 4")

          if not name or name.group(1) != "4.0.0":
              raise SystemExit("ERROR: APK versionName is not 4.0.0")

          print("APK version verified: 4.0.0 (versionCode 4)")
          PY

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK" || {
            echo "ERROR: APK output not found"
            exit 1
          }

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"

          test -n "$APKSIGNER" || {
            echo "ERROR: apksigner was not found"
            exit 1
          }

          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MathMate-4.0.0-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
